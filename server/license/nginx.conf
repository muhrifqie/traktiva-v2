# Traktiva license server behind nginx (shopeeboosthelper): /etc/nginx/sites-available/traktiva-license
# TLS with a self-signed certificate for the IP (no domain yet); the app pins this exact certificate.
limit_req_zone $binary_remote_addr zone=trk_license:10m rate=30r/m;
# Website + admin panel (Next.js, pm2 traktiva-web) on the same port until the domain exists.
limit_req_zone $binary_remote_addr zone=trk_admin:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=trk_admin_login:10m rate=6r/m;

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/traktiva-license.crt;
    ssl_certificate_key /etc/nginx/ssl/traktiva-license.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 16k;
    access_log /var/log/nginx/traktiva-license.access.log;

    # Website (Next.js, pm2 traktiva-web): landing, /masuk + /akun for buyers, /admin. License API keeps /v1 + /health.
    location ~ ^/(v1/|health$) {
        limit_req zone=trk_license burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3820;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 20s;
    }
    # login forms (admin password, buyer key): 6 req/min/IP
    location ~ ^/(admin/login|masuk)$ {
        limit_req zone=trk_admin_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/traktiva-admin-proxy.conf;
    }
    location / {
        limit_req zone=trk_admin burst=60 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/traktiva-admin-proxy.conf;
    }
}
# ---- /etc/nginx/snippets/traktiva-admin-proxy.conf ----
