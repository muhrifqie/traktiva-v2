# traktiva.site + subdomains (http): Lets Encrypt challenge, everything else -> https
server {
    listen 80; listen [::]:80;
    server_name traktiva.site www.traktiva.site app.traktiva.site admin.traktiva.site api.traktiva.site download.traktiva.site;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}
