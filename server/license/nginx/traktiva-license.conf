# MOVED 2026-11-23: traffic arrives from the old server (43.156.15.173:8443, nginx stream + proxy_protocol)
# Traktiva license API (/v1, /health) on :8443 with the self-signed cert pinned in the desktop app (fingerprint only).
# The website/admin panel is also served here for app builds that still link to :8443/admin.
server {
    listen 8443 ssl proxy_protocol;
    listen [::]:8443 ssl proxy_protocol;
    set_real_ip_from 43.156.15.173;
    real_ip_header proxy_protocol;
    server_name _;
    ssl_certificate     /etc/nginx/ssl/traktiva-license.crt;
    ssl_certificate_key /etc/nginx/ssl/traktiva-license.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    access_log /var/log/nginx/traktiva-license.access.log;
    location ~ ^/(v1/|health$) {
        limit_req zone=trk_license burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3820;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 20s;
    }
    # web pages moved to the domain (sign-in cookies belong to traktiva.site); this address keeps only the API
    location / { return 302 https://traktiva.site$request_uri; }
}
