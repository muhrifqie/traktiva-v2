# traktiva.site + subdomains over HTTPS (Let's Encrypt, renewed by certbot.timer). One Next.js app (pm2 traktiva-web,
# 127.0.0.1:3821) serves the site, the member area and the admin panel; nginx gives each part its own host.
# Rate-limit zones (trk_license / trk_login / trk_read / trk_write) are defined in conf.d/traktiva-zones.conf.

map $uri $trk_member_path { ~^/(akun|lisensi|aplikasi|pesanan|aktivitas|bantuan|pengaturan|masuk|daftar|lupa-password|atur-password|beli)(/|$) 1; default 0; }

# shared TLS settings
ssl_certificate     /etc/letsencrypt/live/traktiva.site/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/traktiva.site/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:trk_ssl:10m;

# www -> apex
server {
    listen 443 ssl http2; listen [::]:443 ssl http2;
    server_name www.traktiva.site;
    return 301 https://traktiva.site$request_uri;
}

# traktiva.site: landing, harga. Account pages live on app., the admin panel on admin.
server {
    listen 443 ssl http2; listen [::]:443 ssl http2;
    server_name traktiva.site;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log /var/log/nginx/traktiva-site.access.log;
    include /etc/nginx/snippets/traktiva-static.conf;
    if ($trk_member_path) { return 302 https://app.traktiva.site$request_uri; }
    location ^~ /admin { return 302 https://admin.traktiva.site$request_uri; }
    location ~ ^/(v1/|health$) { return 308 https://api.traktiva.site$request_uri; }
    location / {
        include /etc/nginx/snippets/traktiva-limits.conf;
        include /etc/nginx/snippets/traktiva-admin-proxy.conf;
    }
}

# app.traktiva.site: member area, sign-in, checkout, OAuth + payment webhook (/api/*)
server {
    listen 443 ssl http2; listen [::]:443 ssl http2;
    server_name app.traktiva.site;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log /var/log/nginx/traktiva-app.access.log;
    include /etc/nginx/snippets/traktiva-static.conf;
    location = / { return 302 /akun; }
    location = /harga { return 302 https://traktiva.site/harga; }
    location ^~ /admin { return 302 https://admin.traktiva.site$request_uri; }
    location ~ ^/(masuk|lupa-password)$ {
        limit_req zone=trk_login burst=5 nodelay; include /etc/nginx/snippets/traktiva-limits.conf;
        include /etc/nginx/snippets/traktiva-admin-proxy.conf;
    }
    location / {
        include /etc/nginx/snippets/traktiva-limits.conf;
        include /etc/nginx/snippets/traktiva-admin-proxy.conf;
    }
}

# admin.traktiva.site: admin panel only (member sign-in happens on app.)
server {
    listen 443 ssl http2; listen [::]:443 ssl http2;
    server_name admin.traktiva.site;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    access_log /var/log/nginx/traktiva-admin.access.log;
    include /etc/nginx/snippets/traktiva-static.conf;
    location = / { return 302 /admin; }
    if ($trk_member_path) { return 302 https://app.traktiva.site$request_uri; }
    location = /admin/login {
        limit_req zone=trk_login burst=5 nodelay; include /etc/nginx/snippets/traktiva-limits.conf;
        include /etc/nginx/snippets/traktiva-admin-proxy.conf;
    }
    location ~ ^/(admin|_next|api|logo\.svg|icon\.png|favicon\.ico) {
        include /etc/nginx/snippets/traktiva-limits.conf;
        include /etc/nginx/snippets/traktiva-admin-proxy.conf;
    }
    location / { return 302 https://traktiva.site$request_uri; }
}

# api.traktiva.site: license API for the desktop app (/v1, /health). Nothing else.
server {
    listen 443 ssl http2; listen [::]:443 ssl http2;
    server_name api.traktiva.site;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log /var/log/nginx/traktiva-api.access.log;
    client_max_body_size 16k;
    location ~ ^/(v1/|health$) {
        limit_req zone=trk_license burst=20 nodelay; limit_req_status 429;
        proxy_pass http://127.0.0.1:3820;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 20s;
    }
    location / { return 404; }
}

# download.traktiva.site: installer files (/srv/traktiva-download). The bare host opens the Aplikasi page.
server {
    listen 443 ssl http2; listen [::]:443 ssl http2;
    server_name download.traktiva.site;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log /var/log/nginx/traktiva-download.access.log;
    root /srv/traktiva-download;
    location = / { return 302 https://app.traktiva.site/aplikasi; }
    location / { try_files $uri =404; autoindex off; }
}
