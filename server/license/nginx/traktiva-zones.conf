# Traktiva rate limits (shared by the license API on :8443 and the website)
limit_req_zone $binary_remote_addr zone=trk_license:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=trk_admin:10m rate=120r/m;
# sign-in: only form submits (POST) count; page loads / RSC prefetches fall under trk_admin
map $request_method $trk_login_key { POST $binary_remote_addr; default ""; }
limit_req_zone $trk_login_key zone=trk_login:10m rate=6r/m;
# website: reads and writes counted separately (static files are not limited, see snippets/traktiva-static.conf)
map $request_method $trk_read_key { GET $binary_remote_addr; HEAD $binary_remote_addr; default ""; }
map $request_method $trk_write_key { GET ""; HEAD ""; OPTIONS ""; default $binary_remote_addr; }
limit_req_zone $trk_read_key zone=trk_read:10m rate=50r/s;
limit_req_zone $trk_write_key zone=trk_write:10m rate=120r/m;
