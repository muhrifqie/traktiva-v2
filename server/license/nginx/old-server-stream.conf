# Traktiva moved to the new VPS (43.133.142.25) on 2026-11-23. Installed desktop apps still call 43.156.15.173:8443 and
# pin its certificate, so this server only passes the TLS connection through (the new VPS terminates TLS with the same
# certificate) and sends the visitor IP along with PROXY protocol (rate limits stay per visitor).
stream {
    server {
        listen 8443;
        listen [::]:8443;
        proxy_pass 43.133.142.25:8443;
        proxy_protocol on;
        proxy_connect_timeout 5s;
    }
}
