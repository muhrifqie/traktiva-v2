# Static files: no rate limit. Hashed build files come straight from disk and are cached by the browser for a year.
location ^~ /_next/static/ {
    alias /srv/traktiva-web/.next/static/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}
location ~ ^/(icon\.png|logo\.svg|favicon\.ico)$ {
    include /etc/nginx/snippets/traktiva-admin-proxy.conf;
}
