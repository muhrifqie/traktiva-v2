# Static files: no rate limit. Hashed build files come straight from disk and are cached by the browser for a year.
location ^~ /_next/static/ {
    alias /srv/traktiva-web/.next/static/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}
# icons: also asked for by browsers on admin./api./download. (each host includes this file or proxies them)
location ~ ^/(favicon\.ico|icon\.svg|icon\.png|icon-(192|512)\.png|apple-touch-icon\.png|site\.webmanifest|logo\.svg)$ {
    include /etc/nginx/snippets/traktiva-admin-proxy.conf;
}
